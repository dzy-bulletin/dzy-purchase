<meta name="description" content="鼎兆元貨單辨識系統｜會計核對門市上傳的貨單：對照照片確認品項、數量、金額後入帳。">

<style>
  body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #hdr{position:static}
  #shell{flex:1;min-height:0}
  #shell>#col{min-height:0}
  #col>#app{display:flex;flex-direction:column;min-height:0;flex:1}
  #login{overflow:auto}
  .main{display:flex;flex:1;min-height:0}
  .lside{width:180px;border-right:1px solid var(--line);overflow:auto;flex:none;display:flex;flex-direction:column}
  .lside .sel-wrap{padding:.8rem 1rem;border-bottom:1px solid var(--line)}
  .lside .item{padding:.9rem 1.1rem;border-bottom:1px solid var(--faint);cursor:pointer;display:flex;flex-direction:column;gap:.1rem}
  .lside .item:hover{background:var(--panel)}
  .lside .item>div:nth-child(n+3){font-family:var(--mono)}
  .lside .item{border-left:3px solid transparent}
  .lside .item.sel{background:var(--panel);border-left-color:var(--brand)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;flex:none}
  .work{flex:1;display:flex;min-width:0;min-height:0}
  .photo{width:max(520px,calc((100vw - 64px) * .55));flex:none;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);padding:1rem;gap:.6rem}
  .viewer{flex:1;overflow:hidden;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--card);box-shadow:var(--shadow);cursor:grab;touch-action:none}
  .viewer.drag{cursor:grabbing}
  .viewer img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
  .vtools{display:flex;gap:.4rem;flex-wrap:wrap}
  .vtools button{min-height:44px;padding:0 .8rem;font-size:.85rem}
  .detail{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:0}
  .dscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:1rem .8rem .6rem}
  .dfoot{flex:none;background:var(--bg);border-top:1px solid var(--line);padding:.5rem .8rem .6rem;box-shadow:0 -6px 14px rgba(0,0,0,.06)}
  .dfoot .sum{margin:0 0 .5rem;padding:.45rem .7rem;font-size:.9rem}
  .dfoot .actions{position:static;padding:.2rem 0 0;border-top:0}
  .dfoot #note{margin-bottom:.4rem;font-size:.85rem}
  .lcard .l1,.lcard .l4{display:flex;gap:.5rem;align-items:center}
  .lcard .l1 input{flex:1;min-width:0}
  .lcard .l3{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:.4rem}
  .lcard .l3 label{display:flex;flex-direction:column;gap:.15rem;font-size:.72rem;font-weight:700;color:var(--mute)}
  .lcard input{min-height:40px;padding:0 .5rem;width:100%;min-width:0;font-size:15px;color:var(--ink)}
  .lcard .l3 input{font-size:16px;font-weight:700}
  .lcard .l3 input.num{text-align:right}
  .lcard .l4 .why{flex:1;margin:0;min-width:0}
  .lcard .ck{display:flex;align-items:center;gap:.3rem;font-size:.85rem;font-weight:700;flex:none;cursor:pointer;min-height:44px}
  .lcard .ck input{width:26px;height:26px;min-height:0;padding:0;margin:0}
  .lcard .l1 button{min-width:40px;min-height:40px;padding:0;flex:none}
  .lcard .pk{min-width:0}
  .head{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin-top:.8rem}
  .head .wide{grid-column:1/-1}
  .taxbox{display:flex;flex-direction:column;gap:.35rem}
  .taxinc{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--sub);cursor:pointer}
  .taxinc input{width:auto;margin:0}
  .why{font-size:.8rem;margin-top:.15rem}
  .why .r{font-weight:500}
  .sum{margin:1rem 0;padding:.7rem .9rem;border:1px solid var(--line);background:var(--panel);border-radius:var(--card)}
  .sum.bad{border-color:var(--red);background:var(--red-bg)}
  .actions{position:sticky;bottom:0;background:var(--bg);padding:.7rem 0;display:flex;gap:.6rem;flex-wrap:wrap;border-top:1px solid var(--line);align-items:center}
  .hand{background:var(--yellow-bg);color:var(--yellow-t);padding:.5rem .7rem;margin:.5rem 0;border:1px solid var(--yellow);border-radius:var(--radius)}
  .pk{position:relative;min-width:84px}
  .pk .sug{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.25rem}
  .pk .sug button{min-height:32px;padding:0 .6rem;font-size:.8rem;border-style:dashed}
  .pk .dd{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--mute);max-height:240px;overflow:auto;border-radius:var(--radius)}
  .pk .dd div{padding:.55rem .7rem;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:.5rem;font-size:.9rem}
  .pk .dd div:hover,.pk .dd div.hl{background:var(--faint)}
  .pk .dd .add{border-top:1px solid var(--line);color:var(--accent);font-weight:500}
  .pk .dd small{color:var(--sub)}
  .ov{position:fixed;inset:0;background:rgba(44,42,41,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
  .ov .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--card);padding:1.2rem;width:100%;max-width:400px}
  @media (max-width:1400px){.lside{width:180px}}
  @media (max-width:860px){body{overflow:auto;height:auto}#shell{flex:none}.main,.work{flex-direction:column}.lside{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:220px}.photo{width:auto;flex:none;min-height:300px;border-right:0}.dscroll{overflow:visible}.dfoot{position:sticky;bottom:0}}
</style>
</head>
<body>
<div id="hdr"></div>
<section id="login" class="hidden"></section>

<section id="app" class="hidden">
  <div class="main">
    <div class="lside">
      <div class="sel-wrap row"><h2 id="listTitle" class="grow" style="margin:0">待核對</h2>
        <button id="reload" type="button" class="sm">重新整理</button></div>
      <div id="list"></div>
    </div>
    <div class="work" id="work"><div class="detail muted">請從左側選一張貨單</div></div>
  </div>
</section>
<div id="ovHost"></div>

<script>window.PAGE_ROLE = 'review';</script>
<script src="js/config.js"></script>
<script src="js/rules.js"></script>
<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/common.js"></script>
<script>
'use strict';
var STATUS_TEXT = { uploaded: '已送出', queued: '排隊中', recognizing: '辨識中', review: '待核對', confirmed: '已入帳', failed: '辨識失敗', returned: '退回重拍' };
var FLAG = {   // 代碼 → [顏色, 中文原因]
  DATE_FIXED: ['y', '日期已自動補上（讀不出或年份離拍照日太遠），請對照照片確認'], AMOUNT_FIXED: ['y', '金額漏零，已改用數量×單價'],
  AMOUNT_MISMATCH: ['r', '數量×單價≠金額'], SUM_MISMATCH: ['r', '品項加總對不上總額'], PRICE_MISSING: ['r', '缺單價'],
  HANDWRITTEN: ['y', '有手寫修改'], ITEM_UNMAPPED: ['y', '品名還沒對到統一品名'], UNIT_UNCONVERTED: ['y', '這個單位還沒設定換算']
};
var RED = { AMOUNT_MISMATCH: 1, SUM_MISMATCH: 1, PRICE_MISSING: 1 };
var STATUSES = { review: '待核對', returned: '退回', confirmed: '已入帳', failed: '辨識失敗' };
var STATUS = 'review';
var cur = null;      // 目前貨單（可編輯副本）
var dirty = false;
var ITEMS = {};      // id → {id,name,category,base_unit}（品名快取，用來顯示 item_id 對應的名字）
var sugCache = {};   // vendor_id|raw → 建議清單

Common.gate({
  title: '貨單核對', nav: 'review', roles: ['accountant', 'admin'], roleError: '這個帳號不是會計帳號',
  loginHint: '會計與管理員登入', accLabel: '帳號',
  onHash: function (k) { setStatus(k); },
  onReady: function () { loadItems(); var h = (location.hash || '').slice(1); STATUS = STATUSES[h] ? h : 'review'; $('listTitle').textContent = STATUSES[STATUS]; loadList(); }
});
$('reload').onclick = function () { loadList(); };
/* 側欄切換狀態只改 hash（review.html#returned…），這裡接手 */
function setStatus(k) {
  if (!STATUSES[k] || k === STATUS) return;
  if (dirty && !confirm('目前這張有改動還沒儲存，確定離開？')) { location.hash = STATUS; return; }
  STATUS = k; dirty = false; cur = null; $('listTitle').textContent = STATUSES[k];
  $('work').innerHTML = '<div class="detail muted">請從左側選一張貨單</div>'; loadList();
}
async function loadCounts(curList) {
  var out = {};
  await Promise.all(Object.keys(STATUSES).map(async function (k) {
    if (k === STATUS && curList) { out[k] = curList.length; return; }
    try { out[k] = (await Common.get('/review', { status: k })).length; } catch (e) {}
  }));
  Common.setCounts(out);
}

async function loadItems() {
  try { (await Common.get('/items')).forEach(function (it) { ITEMS[it.id] = it; }); } catch (e) {}
  if (cur) buildRows();
}

/* ---------- 清單 ---------- */
async function loadList() {
  var box = $('list');
  try {
    var list = await Common.get('/review', { status: STATUS });
    loadCounts(list);
    if (!list.length) { box.innerHTML = '<div class="item muted">沒有貨單</div>'; return; }
    box.innerHTML = list.map(function (s) {
      var red = (s.flags || []).some(function (f) { return RED[f]; });
      return '<div class="item' + (cur && cur.id === s.id ? ' sel' : '') + '" data-id="' + esc(s.id) + '"><div class="row"><b class="grow" style="font-weight:400">' + esc(s.vendor_name || '（未指定）') + '</b>' +
        (red ? '<span class="dot" title="有紅色檢核"></span><span class="r" style="font-size:.75rem">紅</span>' : '') + '</div><div class="muted">' + esc(s.store_name || s.store_id || '') + '　' + esc((s.doc_date || '').slice(5)) + '</div><div style="font-variant-numeric:tabular-nums">' + (s.total != null ? '$ ' + fmt(s.total) : '') + '</div><div class="muted" style="font-size:.72rem">' + esc(s.id) + '</div>' + (STATUS === 'failed' ? '<button class="sm" data-retry="' + esc(s.id) + '">重新辨識</button>' : '') + '</div>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('[data-retry]'), function (b) { b.onclick = function (ev) { ev.stopPropagation(); doRetry(b.dataset.retry, true); }; });
    Array.prototype.forEach.call(box.querySelectorAll('.item[data-id]'), function (el) { el.onclick = function () { openSlip(el.dataset.id); }; });
  } catch (e) { box.innerHTML = '<div class="item"><div class="msg err">' + esc(e.message) + '</div></div>'; }
}

/* ---------- 單張 ---------- */
var photoUrls = [];
function freePhotos() { photoUrls.forEach(function (u) { URL.revokeObjectURL(u); }); photoUrls = []; }
async function openSlip(id) {
  if (dirty && !confirm('目前這張有改動還沒儲存，確定離開？')) return;
  try {
    var d = await API.call('/slips/' + encodeURIComponent(id));
    d.lines = (d.lines || []).map(function (l) { return Object.assign({ checked: 0, flags: [], item_id: null }, l); });
    cur = d; dirty = false; freePhotos(); render(); loadList();
  } catch (e) { alert(e.message); }
}

function render() {
  var d = cur, ro = d.status === 'confirmed' || d.status === 'returned', dis = ro ? 'disabled' : '';
  $('work').innerHTML =
    '<div class="photo"><div class="viewer" id="viewer"><img id="vimg" alt="貨單照片"></div>' +
    '<div class="vtools" id="vtools"></div></div>' +
    '<div class="detail"><div class="dscroll"><div class="row"><h2 class="grow" style="margin:0">' + esc(d.id) + '</h2><span class="badge b-' + esc(d.status) + '">' + esc(STATUS_TEXT[d.status] || d.status) + '</span></div>' +
    '<div class="head">' +
    '<label class="f">廠商<input id="f_vendor" value="' + esc(d.vendor_name || '') + '" ' + dis + '></label>' +
    '<label class="f">日期<input id="f_date" value="' + esc(d.doc_date || '') + '" placeholder="YYYY-MM-DD" ' + dis + '></label>' +
    '<label class="f">單號<input id="f_no" value="' + esc(d.doc_no || '') + '" ' + dis + '></label>' +
    '<label class="f">未稅合計（沒有就留空）<input id="f_subtotal" inputmode="decimal" value="' + (d.subtotal == null ? '' : d.subtotal) + '" ' + dis + '></label>' +
    '<div class="taxbox"><label class="f">稅額（沒有就留空）<input id="f_tax" inputmode="decimal" value="' + (d.tax == null ? '' : d.tax) + '" ' + dis + '></label>' +
    '<label class="taxinc"><input type="checkbox" id="f_taxinc" ' + (d.tax_included ? 'checked ' : '') + dis + '>品項金額已含稅</label></div>' +
    '<label class="f">總額（含稅，入帳以此為準）<input id="f_total" inputmode="decimal" value="' + (d.total == null ? '' : d.total) + '" ' + dis + '></label>' +
    '<label class="f wide">手寫說明（清空＝取消手寫標記）<input id="f_hand" value="' + esc(d.handwritten_note || '') + '" ' + dis + '></label></div>' +
    (d.total_handwritten ? '<div class="hand">總額有手寫修正，請對照照片確認</div>' : '') +
    (d.status === 'returned' && d.return_reason ? '<div class="msg err">退回原因：' + esc(d.return_reason) + '（要修改請先按「重新開放」）</div>' : '') +
    '<div id="slipWhy" class="why"></div>' +
    '<div id="tb"></div>' +
    (ro ? '' : '<button id="addLine" type="button" style="margin-top:.2rem">＋ 新增一列</button>') + '</div>' +
    '<div class="dfoot"><div class="sum" id="sum"></div><div id="note"></div>' +
    '<div class="actions" id="actions"></div></div></div>';
  buildRows(); buildActions(); buildViewer(); bindHead(); update();
}

function bindHead() {
  var map = { f_vendor: 'vendor_name', f_date: 'doc_date', f_no: 'doc_no', f_total: 'total', f_subtotal: 'subtotal', f_tax: 'tax', f_hand: 'handwritten_note' };
  var numeric = { f_total: 1, f_subtotal: 1, f_tax: 1 };
  $('f_taxinc').onchange = function () { cur.tax_included = this.checked ? 1 : 0; dirty = true; update(); };   /* 勾選即重算，隨儲存（PUT）送出 */
  Object.keys(map).forEach(function (id) {
    $(id).oninput = function () { cur[map[id]] = numeric[id] ? num(this.value) : this.value; dirty = true; update(); };
  });
  if ($('addLine')) $('addLine').onclick = function () {
    cur.lines.push({ id: null, seq: cur.lines.length + 1, raw_name: '', qty: null, unit: '', unit_price: null, amount: null, flags: [], checked: 0, item_id: null });
    dirty = true; buildRows(); update();
  };
}

function itemName(l) { var it = l.item_id && ITEMS[l.item_id]; return it ? it.name : (l.item_name || (l.item_id ? '（品項 #' + l.item_id + '）' : '')); }

function buildRows() {
  var ro = cur.status === 'confirmed' || cur.status === 'returned', tb = $('tb');
  tb.innerHTML = cur.lines.map(function (l, i) {
    var dsb = ro ? 'disabled' : '';
    function inp(k, label, num) { return '<label>' + label + '<input class="' + (num ? 'num' : '') + '" data-i="' + i + '" data-k="' + k + '" ' + (num ? 'inputmode="decimal" ' : '') + 'value="' + esc(l[k] == null ? '' : l[k]) + '" ' + dsb + ' aria-label="' + label + '"></label>'; }
    return '<div class="lcard" id="r' + i + '">' +
      '<div class="l1"><input data-i="' + i + '" data-k="raw_name" value="' + esc(l.raw_name || '') + '" placeholder="單上品名" ' + dsb + ' aria-label="品名（單上寫的）">' + (ro ? '' : '<button class="sm warn" type="button" data-del="' + i + '" aria-label="刪除這列">✕</button>') + '</div>' +
      '<div class="pk" data-pk="' + i + '"><input data-i="' + i + '" data-k="item" value="' + esc(itemName(l)) + '" placeholder="搜尋統一品名" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="dd' + i + '" ' + dsb + ' aria-label="統一品名"><div class="dd hidden" role="listbox" id="dd' + i + '" aria-label="統一品名選項"></div><div class="sug"></div></div>' +
      '<div class="l3">' + inp('qty', '數量', 1) + inp('unit', '單位') + inp('unit_price', '單價', 1) + inp('amount', '金額', 1) + '</div>' +
      '<div class="l4"><div class="why" data-why="' + i + '"></div><label class="ck"><input type="checkbox" data-i="' + i + '" data-k="checked" ' + (l.checked ? 'checked' : '') + ' ' + dsb + ' aria-label="已核對">確認</label></div></div>';
  }).join('');
  Array.prototype.forEach.call(tb.querySelectorAll('input[data-k]'), function (el) {
    var k = el.dataset.k; if (k === 'item') return;
    el.oninput = el.onchange = function () {
      var l = cur.lines[+el.dataset.i];
      if (k === 'checked') l.checked = el.checked ? 1 : 0;
      else if (k === 'qty' || k === 'unit_price' || k === 'amount') l[k] = num(el.value);
      else l[k] = el.value;
      dirty = true; update();
    };
    if (k === 'raw_name') el.addEventListener('change', function () { loadSuggest(+el.dataset.i); });
  });
  Array.prototype.forEach.call(tb.querySelectorAll('[data-del]'), function (b) {
    b.onclick = function () { cur.lines.splice(+b.dataset.del, 1); dirty = true; buildRows(); update(); };
  });
  if (!ro) cur.lines.forEach(function (l, i) { bindPicker(i); loadSuggest(i); });
}

/* ---------- 統一品名：搜尋＋建議＋就地新增 ---------- */
function pkBox(i) { return document.querySelector('[data-pk="' + i + '"]'); }
function selectItem(i, it) {
  var l = cur.lines[i]; if (!l) return;
  if (it) { ITEMS[it.id] = it; l.item_id = it.id; l.item_name = it.name; } else { l.item_id = null; l.item_name = ''; }
  dirty = true;
  var box = pkBox(i); if (box) { box.querySelector('input').value = it ? it.name : ''; box.querySelector('.dd').classList.add('hidden'); setExpanded(box.querySelector('input'), false); }
  renderSuggest(i, []); update();
  if (!it) loadSuggest(i);
}
/* 下拉的 ARIA 狀態：aria-expanded 與 aria-activedescendant 一起維護 */
function setExpanded(inp, open) { inp.setAttribute('aria-expanded', open ? 'true' : 'false'); if (!open) inp.removeAttribute('aria-activedescendant'); }
function bindPicker(i) {
  var box = pkBox(i); if (!box) return;
  var inp = box.querySelector('input'), dd = box.querySelector('.dd'), timer = null, seq = 0, hl = -1;
  function opts() { return dd.querySelectorAll('[role="option"]'); }
  function isOpen() { return !dd.classList.contains('hidden'); }
  function closeDd() { dd.classList.add('hidden'); hl = -1; setExpanded(inp, false); }
  function setHl(n) {
    var o = opts(); if (!o.length) return;
    hl = (n + o.length) % o.length;
    Array.prototype.forEach.call(o, function (el, k) { el.classList.toggle('hl', k === hl); el.setAttribute('aria-selected', k === hl ? 'true' : 'false'); });
    inp.setAttribute('aria-activedescendant', o[hl].id);
    o[hl].scrollIntoView({ block: 'nearest' });
  }
  function choose(t) {
    if (!t) return;
    var nm = inp.value.trim() && inp.value !== itemName(cur.lines[i]) ? inp.value.trim() : (cur.lines[i].raw_name || '').trim();
    if (t.dataset.add) openNewItem(i, nm); else selectItem(i, ITEMS[t.dataset.id]);
  }
  async function search() {
    var q = inp.value.trim(), my = ++seq, list = [];
    if (inp.value === itemName(cur.lines[i])) q = '';   // 還沒改字就列出全部
    try { list = await Common.get('/items', { q: q }); } catch (e) { list = []; }
    if (my !== seq) return;
    list = list.filter(function (it) { return it.active !== 0 && it.active !== false; }).slice(0, 8);
    list.forEach(function (it) { ITEMS[it.id] = it; });
    var newName = inp.value.trim() && inp.value !== itemName(cur.lines[i]) ? inp.value.trim() : (cur.lines[i].raw_name || '').trim();
    dd.innerHTML = list.map(function (it) { return '<div role="option" aria-selected="false" id="dd' + i + 'o' + it.id + '" data-id="' + it.id + '">' + esc(it.name) + ' <small>' + (it.category ? esc(it.category) + (it.base_unit ? '・' + esc(it.base_unit) : '') : '待補分類') + '</small></div>'; }).join('') +
      '<div class="add" role="option" aria-selected="false" id="dd' + i + 'add" data-add="1">＋ 新增品項' + (newName ? '「' + esc(newName) + '」' : '') + '</div>';
    var rc = inp.getBoundingClientRect();   // fixed 定位：不被表格的橫向捲動容器裁掉
    dd.style.left = rc.left + 'px'; dd.style.top = (rc.bottom + 2) + 'px'; dd.style.width = Math.max(rc.width, 220) + 'px';
    dd.classList.remove('hidden'); hl = -1; inp.removeAttribute('aria-activedescendant'); setExpanded(inp, true);
    dd.onmousedown = function (ev) {
      ev.preventDefault();
      var t = ev.target.closest('div[data-id],div[data-add]'); if (!t) return;
      if (t.dataset.add) openNewItem(i, newName); else selectItem(i, ITEMS[t.dataset.id]);
    };
  }
  inp.addEventListener('focus', function () { inp.select(); search(); });
  inp.addEventListener('input', function () {
    if (inp.value === '') { if (cur.lines[i].item_id) selectItem(i, null); }
    clearTimeout(timer); timer = setTimeout(search, 200);
  });
  inp.addEventListener('blur', function () { setTimeout(function () { closeDd(); inp.value = itemName(cur.lines[i]); }, 150); });
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (isOpen()) { e.preventDefault(); closeDd(); inp.value = itemName(cur.lines[i]); } return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!isOpen()) { search(); return; }
      setHl(hl < 0 ? (e.key === 'ArrowDown' ? 0 : -1) : hl + (e.key === 'ArrowDown' ? 1 : -1));
    } else if (e.key === 'Enter' && isOpen() && hl >= 0) { e.preventDefault(); choose(opts()[hl]); }
  });
}
async function loadSuggest(i) {

/* 即時重算：紅色旗標（金額不符、缺單價、加總不符）由前端依目前數字重判；黃色旗標沿用後端。入帳時後端會再重算一次。 */
function lineFlags(l) {
  var f = (l.flags || []).filter(function (c) { return !RED[c] && c !== 'ITEM_UNMAPPED'; });
  if (!l.item_id && (l.raw_name || '').trim()) f.push('ITEM_UNMAPPED');   // 選定統一品名後黃旗消失
  if (l.unit_price == null) f.push('PRICE_MISSING');
  else if (l.qty != null && l.amount != null && !Rules.moneyEq(l.qty * l.unit_price, l.amount)) f.push('AMOUNT_MISMATCH');   // 四捨五入後相符就不算錯
  return f;
}
/* 數量、單價、金額都要填且 > 0（後端同規則；缺值本身就是紅） */
function lineBad(l) { return l.qty == null || l.unit_price == null || l.amount == null || l.qty <= 0 || l.unit_price <= 0 || l.amount <= 0; }
function calc() {
  /* 與後端同一支 web/js/rules.js；一張單只套一條式子：未勾＝各列加總＋稅額（空白＝0）＝總額（未稅合計只核對≈各列加總）；已勾＝各列加總＝總額（未稅合計＋稅額都有值時須＝總額） */
  var c = Rules.sumCheck(cur.lines.map(function (l) { return l.amount; }), cur.subtotal, cur.tax, cur.total, cur.tax_included ? 1 : 0);
  return { sum: c.sum, sumOk: c.ok, missing: c.missing };
}
/* 總額對不上時給會計看的白話說明（規則：品項加總＋稅額＝總額；未稅合計只核對） */
function sumWhy(c) {
  if (c.missing) return '總額或某一列金額沒有填，請對照照片補上。';
  if (cur.tax_included) {
    if (cur.tax != null && cur.tax >= cur.total) return '稅額 ' + fmt(cur.tax) + ' 不應大於或等於總額 ' + fmt(cur.total) + '，請檢查稅額是不是讀成了總計。';
    if (!Rules.moneyEq(c.sum, cur.total)) return '品項加總 ' + fmt(c.sum) + '，但單上總額是 ' + fmt(cur.total) + '，差 ' + fmt(r2(Math.abs(c.sum - cur.total))) + '。這張單已勾選「品項金額已含稅」，品項加總應該直接等於總額；請檢查是不是多算或少算了一列，或某一列金額讀錯。如果單上品項金額其實是未稅，請取消勾選。';
    var us = r2(cur.subtotal + cur.tax);
    return '未稅合計 ' + fmt(cur.subtotal) + ' ＋ 稅額 ' + fmt(cur.tax) + ' ＝ ' + fmt(us) + '，但總額是 ' + fmt(cur.total) + '，差 ' + fmt(r2(Math.abs(us - cur.total))) + '。請檢查未稅合計、稅額、總額有沒有填錯。';
  }
  var tax = cur.tax || 0, should = r2(c.sum + tax);
  if (!Rules.moneyEq(should, cur.total)) {
    var diff = fmt(r2(Math.abs(should - cur.total)));
    if (cur.tax != null) return '品項加總 ' + fmt(c.sum) + ' ＋ 稅額 ' + fmt(tax) + ' ＝ ' + fmt(should) + '，但單上總額是 ' + fmt(cur.total) + '，差 ' + diff + '。請檢查是不是多算了一列（例如把稅額或合計當成品項），或某一列金額讀錯。';
    return '品項加總 ' + fmt(c.sum) + '，但單上總額是 ' + fmt(cur.total) + '，差 ' + diff + '。請檢查是不是多算或少算了一列，或某一列金額讀錯；如果單上另外列了稅額，請填在「稅額」欄。';
  }
  return '品項加總 ' + fmt(c.sum) + '，但單上的未稅合計是 ' + fmt(cur.subtotal) + '，差 ' + fmt(r2(Math.abs(c.sum - cur.subtotal))) + '。請檢查品項金額，或未稅合計是不是填錯。';
}
/* 四捨五入後相符時，畫面註明差了多少（不算錯） */
function roundNote(c) {
  if (cur.total == null) return '';
  var calcd = cur.tax_included ? c.sum : r2(c.sum + (cur.tax || 0)), d = r2(Math.abs(calcd - cur.total));
  return d >= 0.01 ? '（四捨五入，差 ' + fmt(d) + '）' : '';
}
/* 紅色分兩種（Eason 2026-10-07）：
   缺數字（數量／單價／金額沒填或 ≤ 0、沒填總額）＝資料不完整，不能入帳；
   對不起來（數量×單價≠金額、加總≠總額）＝提醒，會計確認後仍可入帳，按入帳時再問一次。 */
function update() {
  var c = calc(), reds = 0, missing = 0, unchecked = 0, warn = [];
  cur.lines.forEach(function (l, i) {
    var f = lineFlags(l), bad = lineBad(l), hasR = bad || f.some(function (x) { return RED[x]; }), hasY = f.length && !hasR;
    if (hasR) reds++; if (bad) missing++; if (!l.checked) unchecked++;
    if (!bad && f.indexOf('AMOUNT_MISMATCH') >= 0) warn.push('第 ' + (i + 1) + ' 列 ' + (l.raw_name || '') + '：數量×單價 ' + fmt(r2(l.qty * l.unit_price)) + '，金額 ' + fmt(l.amount));
    var tr = $('r' + i); if (!tr) return;
    tr.className = 'lcard ' + (hasR ? 'red' : (hasY ? 'yellow' : ''));
    var ex = '';
    if (l.qty != null && l.unit_price != null) ex = '<span class="muted">數量×單價＝' + fmt(r2(l.qty * l.unit_price)) + '</span> ';
    tr.querySelector('[data-why]').innerHTML = ex + (bad ? '<span class="r">紅：數量、單價、金額都要填且大於 0</span>　' : '') + f.map(function (x) { var m = FLAG[x] || ['y', x]; return '<span class="' + m[0] + '">' + (m[0] === 'r' ? '紅：' : '黃：') + esc(m[1]) + '</span>'; }).join('　');
  });
  var slipRed = !c.sumOk;
  var sf = (cur.flags || []).filter(function (x) { return !RED[x] && x !== 'SUM_MISMATCH'; });
  $('slipWhy').innerHTML = sf.map(function (x) { var m = FLAG[x] || ['y', x]; var t = (x === 'DATE_FIXED' && cur.date_note) ? cur.date_note + '，請對照照片確認' : m[1]; return '<span class="y">黃：' + esc(t) + '</span>'; }).join('　');
  $('sum').className = 'sum ' + (c.sumOk ? 'good' : 'bad');
  $('sum').innerHTML = '各列加總 <b>' + fmt(c.sum) + '</b>' + (cur.tax != null ? '　稅額 <b>' + fmt(cur.tax) + '</b>' : '') + '　總額 <b>' + (cur.total == null ? '（未填）' : fmt(cur.total)) + '</b>　' +
    (c.sumOk ? '<b>相符</b>' + esc(roundNote(c)) : '<div class="r" style="margin-top:.4rem;line-height:1.6">紅：' + esc(sumWhy(c)) + '</div>');
  if (slipRed && !c.missing) warn.push('總額：' + sumWhy(c));
  var noTotal = cur.total == null;
  cur._reds = reds + (slipRed ? 1 : 0); cur._unchecked = unchecked; cur._warn = warn;
  var blocked = missing > 0 || noTotal || unchecked > 0 || !cur.lines.length;
  var b = $('confirmBtn');
  if (b) { b.disabled = blocked; b.title = blocked ? '資料還沒填完整或還有列沒打勾' : (warn.length ? '還有 ' + warn.length + ' 項紅色提醒，按入帳時會再確認一次' : ''); }
  var n = $('note');
  if (n && b) n.innerHTML = blocked ? '<div class="muted">不能入帳：' + (missing ? missing + ' 列數量／單價／金額沒填　' : '') + (noTotal ? '沒填總額　' : '') + (unchecked ? unchecked + ' 列沒打勾' : '') + (!cur.lines.length ? '沒有明細' : '') + '</div>'
    : (warn.length ? '<div class="r">提醒：還有 ' + warn.length + ' 項紅色沒對上，確認照片無誤仍可入帳</div>' : '');
}

/* ---------- 動作 ---------- */
var STATUS_NAME = { uploaded: '已送出', queued: '排隊辨識中', recognizing: 'AI 辨識中', review: '待核對', confirmed: '已入帳', failed: '辨識失敗', returned: '退回重拍' };
/* 動作被後端擋下時：先查這張單現在的狀態。狀態已經被別人（或另一個分頁）改掉 → 跳窗說清楚並把畫面換成最新狀態；
   狀態沒變 → 照舊在按鈕旁顯示原因。（2026-10-07：會計按「退回」被擋只出現小字，誤以為已退回） */
async function actFail(e) {
  var id = cur && cur.id, was = cur && cur.status, d = null;
  if (id) { try { d = await API.call('/slips/' + encodeURIComponent(id)); } catch (x) {} }
  if (d && d.status !== was) {
    alert('這個動作沒有成功：' + e.message + '\n\n這張貨單剛剛已經變成「' + (STATUS_NAME[d.status] || d.status) + '」（可能有其他人或另一個分頁處理過），畫面會更新成最新狀態。');
    dirty = false; await openSlip(id); return;
  }
  say(e.message, 'err');
}
function buildActions() {
  var a = $('actions'), st = cur.status;
  if (st === 'uploaded' || st === 'queued' || st === 'recognizing') { a.innerHTML = '<span id="actMsg" class="grow"><div class="msg info">這張貨單' + esc(STATUS_NAME[st]) + '，辨識完成後會出現在「待核對」，現在不能修改、入帳或退回。</div></span>'; return; }
  if (st === 'confirmed') { a.innerHTML = '<button id="unconfirmBtn" class="warn">取消入帳</button><span id="actMsg" class="grow"></span>'; $('unconfirmBtn').onclick = doUnconfirm; return; }
  if (st === 'returned') { a.innerHTML = '<button id="reopenBtn" class="warn">重新開放（回到待核對）</button><span id="actMsg" class="grow"></span>'; $('reopenBtn').onclick = doReopen; return; }
  a.innerHTML = '<button id="saveBtn">儲存</button><button id="confirmBtn" class="good" disabled>入帳</button><button id="returnBtn" class="warn">退回重拍</button><span id="actMsg" class="grow"></span>';
  $('saveBtn').onclick = function () { save().then(function (ok) { if (ok) say('已儲存', 'ok'); }); };
  $('confirmBtn').onclick = doConfirm;
  $('returnBtn').onclick = doReturn;
  if (st === 'failed') { var rb = document.createElement('button'); rb.id = 'retryBtn'; rb.textContent = '重新辨識'; rb.onclick = function () { doRetry(cur.id, false); }; a.insertBefore(rb, a.firstChild); }
}
function say(t, cls) { var m = $('actMsg'); if (m) m.innerHTML = '<div class="msg ' + cls + '">' + esc(t) + '</div>'; }
function payload() {
  return { vendor_name: cur.vendor_name, doc_date: cur.doc_date, doc_no: cur.doc_no, total: cur.total, subtotal: cur.subtotal, tax: cur.tax, tax_included: cur.tax_included ? 1 : 0, handwritten_note: cur.handwritten_note || '',
    lines: cur.lines.map(function (l, i) { return { id: l.id, seq: i + 1, raw_name: l.raw_name, item_id: l.item_id || null, qty: l.qty, unit: l.unit, unit_price: l.unit_price, amount: l.amount, checked: l.checked ? 1 : 0 }; }) };
}
async function save() {
  /* issue #21：日期沒填（常見於辨識失敗的貨單）直接說清楚，不要回「日期格式看不懂」 */
  if (!String(cur.doc_date == null ? '' : cur.doc_date).trim()) { say('請填寫日期', 'err'); if ($('f_date')) $('f_date').focus(); return false; }
  try { var d = await API.call('/slips/' + encodeURIComponent(cur.id), { method: 'PUT', body: payload() });
    if (d && d.lines) { d.lines = d.lines.map(function (l) { return Object.assign({ checked: 0, flags: [], item_id: null }, l); }); var keep = cur.status; cur = Object.assign(cur, d); cur.status = d.status || keep; }
    dirty = false;
    /* issue #23：儲存成功後重畫明細列與旗標區（後端可能已清 DATE_FIXED、重算旗標） */
    buildRows(); update();
    return true; }
  catch (e) { await actFail(e); return false; }
}
/* 入帳前預告：本張會自動建立的廠商／品項（規則與後端共用 Rules.nameKey／okAuto*；廠商別名無法由前端得知，極少數情況會多報） */
async function autoCreatePreview() {
  var vs = [], its = [];
  try { vs = await Common.get('/vendors'); its = await Common.get('/items'); } catch (e) { return { vendors: [], items: [] }; }
  var outV = [], outI = [], seenI = {};
  var vn = String(cur.vendor_name_raw || '').trim();
  if (!cur.vendor_id && Rules.okAutoVendorName(vn) && !vs.some(function (v) { return String(v.brand_id) === String(cur.brand_id) && Rules.nameKey(v.name) === Rules.nameKey(vn); })) outV.push(vn);
  cur.lines.forEach(function (l) {
    var rn = String(l.raw_name || '').trim();
    if (l.item_id || !Rules.okAutoItemName(rn)) return;
    var k = Rules.nameKey(rn);
    if (seenI[k] || its.some(function (it) { return String(it.brand_id) === String(cur.brand_id) && Rules.nameKey(it.name) === k; })) return;
    seenI[k] = 1; outI.push(rn);
  });
  return { vendors: outV, items: outI };
}
async function doConfirm() {
  if (!(await save())) return;
  update();
  if (cur._warn && cur._warn.length && !confirm('還有 ' + cur._warn.length + ' 項紅色提醒沒對上：\n\n' + cur._warn.join('\n') + '\n\n成本與損益以各列金額為準。已對照照片確認，仍要入帳嗎？')) return;
  var pv = await autoCreatePreview();
  if (pv.vendors.length || pv.items.length) {
    var parts = [];
    if (pv.vendors.length) parts.push('廠商 ' + pv.vendors.join('、'));
    if (pv.items.length) parts.push('品項 ' + pv.items.join('、'));
    if (!confirm('將自動建立：' + parts.join('；') + '\n\n確定入帳？')) return;
  }
  try { await API.call('/slips/' + encodeURIComponent(cur.id) + '/confirm', { method: 'POST', body: {} });
    dirty = false; var id = cur.id; cur = null; $('work').innerHTML = '<div class="detail"><div class="msg ok">' + esc(id) + ' 已入帳</div></div>'; loadList(); }
  catch (e) { await actFail(e); }
}
async function doReturn() {
  var reason = prompt('退回原因（會顯示給門市，例如：照片太糊）', '照片不清楚，請重拍');
  if (reason == null) return;
  try { await API.call('/slips/' + encodeURIComponent(cur.id) + '/return', { method: 'POST', body: { reason: reason } });
    dirty = false; cur = null; $('work').innerHTML = '<div class="detail"><div class="msg ok">已退回門市重拍</div></div>'; loadList(); }
  catch (e) { await actFail(e); }
}
async function doRetry(id, fromList) {
  if (!confirm('重新辨識這張貨單？（會回到排隊，手動輸入的內容之後會被辨識結果覆蓋）')) return;
  try { await API.call('/slips/' + encodeURIComponent(id) + '/retry', { method: 'POST', body: {} });
    if (cur && cur.id === id) { dirty = false; cur = null; $('work').innerHTML = '<div class="detail"><div class="msg ok">' + esc(id) + ' 已重新排隊辨識</div></div>'; }
    loadList(); }
  catch (e) { if (fromList) alert(e.message); else say(e.message, 'err'); }
}
async function doReopen() {
  if (!confirm('重新開放後這張會回到待核對，退回原因會保留在紀錄裡。確定？')) return;
  try { var d = await API.call('/slips/' + encodeURIComponent(cur.id) + '/reopen', { method: 'POST', body: {} });
    d.lines = (d.lines || []).map(function (l) { return Object.assign({ checked: 0, flags: [], item_id: null }, l); }); cur = d; dirty = false; render(); loadList(); }
  catch (e) { await actFail(e); }
}
async function doUnconfirm() {
  var reason = prompt('取消入帳原因（必填）');
  if (reason == null) return;
  if (!reason.trim()) { say('必須填寫原因', 'err'); return; }
  try { await API.call('/slips/' + encodeURIComponent(cur.id) + '/unconfirm', { method: 'POST', body: { reason: reason.trim() } });
    var id = cur.id; cur = null; $('work').innerHTML = '<div class="detail"><div class="msg ok">' + esc(id) + ' 已取消入帳，回到待核對</div></div>'; loadList(); }
  catch (e) { await actFail(e); }
}

/* ---------- 照片檢視：滾輪縮放、拖曳、多張切換 ---------- */
async function buildViewer() {
  var n = cur.photo_count || 0, tools = $('vtools'), v = $('viewer'), img = $('vimg');
  var st = { k: 1, x: 0, y: 0 }, idx = 0, id = cur.id;
  function apply() { img.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.k + ')'; }
  function fit() { var vw = v.clientWidth, vh = v.clientHeight, iw = img.naturalWidth || 1, ih = img.naturalHeight || 1; st.k = Math.min(vw / iw, vh / ih); st.x = (vw - iw * st.k) / 2; st.y = (vh - ih * st.k) / 2; apply(); }
  async function show(i) {
    idx = i;
    try {
      if (!photoUrls[id + ':' + i]) { var b = await API.call('/photos/' + encodeURIComponent(id) + '/' + (i + 1), { raw: true }); var u = URL.createObjectURL(b); photoUrls.push(u); photoUrls[id + ':' + i] = u; }
      img.onload = fit; img.src = photoUrls[id + ':' + i];
    } catch (e) { v.insertAdjacentHTML('beforeend', '<div class="msg err" style="position:absolute;left:1rem;top:1rem">照片讀不到：' + esc(e.message) + '</div>'); }
    Array.prototype.forEach.call(tools.querySelectorAll('[data-p]'), function (b) { b.className = (+b.dataset.p === i) ? 'primary' : ''; });
  }
  var h = ''; for (var i = 0; i < n; i++) h += '<button data-p="' + i + '">第' + (i + 1) + '張</button>';
  tools.innerHTML = h + '<button id="zin">放大＋</button><button id="zout">縮小－</button><button id="zfit">符合視窗</button>';
  Array.prototype.forEach.call(tools.querySelectorAll('[data-p]'), function (b) { b.onclick = function () { show(+b.dataset.p); }; });
  function zoom(f, cx, cy) { var nk = Math.min(8, Math.max(0.05, st.k * f)), r = nk / st.k; st.x = cx - (cx - st.x) * r; st.y = cy - (cy - st.y) * r; st.k = nk; apply(); }
  $('zin').onclick = function () { zoom(1.3, v.clientWidth / 2, v.clientHeight / 2); };
  $('zout').onclick = function () { zoom(1 / 1.3, v.clientWidth / 2, v.clientHeight / 2); };
  $('zfit').onclick = fit;
  v.onwheel = function (e) { e.preventDefault(); var r = v.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); };
  var drag = null;
  v.onpointerdown = function (e) { drag = { x: e.clientX - st.x, y: e.clientY - st.y }; v.classList.add('drag'); v.setPointerCapture(e.pointerId); };
  v.onpointermove = function (e) { if (!drag) return; st.x = e.clientX - drag.x; st.y = e.clientY - drag.y; apply(); };
  v.onpointerup = v.onpointercancel = function () { drag = null; v.classList.remove('drag'); };
  if (n) show(0); else v.innerHTML = '<div class="msg err" style="margin:1rem">沒有照片</div>';
}


window.addEventListener('scroll', function (e) { if (e.target.closest && e.target.closest('.dd')) return; Array.prototype.forEach.call(document.querySelectorAll('.pk .dd'), function (d) { d.classList.add('hidden'); var i2 = d.parentNode.querySelector('input'); if (i2) setExpanded(i2, false); }); }, true);
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
