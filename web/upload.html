<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBFBF9">
<title>貨單上傳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* 手機上傳頁：字大、按鈕 >= 44px（這裡一律 52px） */
  :root{--fs:18px}
  .wrap{padding-top:1rem;max-width:560px;margin:0 auto;padding:0 1rem 4rem;overflow-x:hidden}
  #login{overflow-x:hidden}
  .hdr{padding:.5rem 1rem}
  .hdr .ttl{font-size:1.05rem;letter-spacing:.1em}
  @media (max-width:520px){.hdr .who{display:none}}
  .hdr .logos img{height:30px}
  .stack button,.bigbtn{min-height:52px;font-size:1rem}
  select,input{min-height:52px;font-size:1rem}
  .thumbs{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
  .thumb{position:relative;width:84px;height:84px;background:var(--surface);border:1px solid var(--line);overflow:hidden;border-radius:var(--radius)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb button{position:absolute;top:0;right:0;min-height:44px;width:44px;padding:0;border:0;border-radius:0;background:rgba(0,0,0,.65);color:#fff;font-size:.9rem}
  .pending{display:flex;align-items:center;gap:.5rem;justify-content:space-between}
  .slip{border-top:1px solid var(--faint);padding:.7rem 0}
  .slip:first-child{border-top:0}
  .slip.ret{background:var(--red-bg);border:1px solid var(--red);border-radius:var(--radius);padding:.7rem;margin:.5rem 0}
  .slip .t{word-break:break-all}
  .slip .muted{font-family:var(--mono);font-size:.75rem}
  .bigbtn{width:100%;margin-top:.5rem}
  .step{display:flex;align-items:baseline;gap:.6rem}
  .step b{font-family:var(--mono);font-size:.8rem;font-weight:700;color:var(--bg);background:var(--ink);border-radius:var(--radius);width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:none}
</style>
</head>
<body>
<div id="hdr"></div>
<section id="login" class="hidden"></section>

<section id="app" class="hidden">
  <div class="wrap">
    <div id="pendingBar" class="msg info pending hidden">
      <span id="pendingText"></span><button id="retryNow" type="button">立即補傳</button>
    </div>
    <div id="msg"></div>

    <div class="card stack">
      <div class="step"><b>1</b><h2 style="margin:0">選廠商</h2></div>
      <select id="vendorSel" aria-label="廠商" style="margin-top:.5rem"></select>
      <input id="vendorName" class="hidden" placeholder="請輸入廠商名稱" style="margin-top:.5rem">
      <div class="step" style="margin-top:1.2rem"><b>2</b><h2 style="margin:0">拍貨單</h2></div>
      <p class="muted">長單可拍多張，會算同一張貨單。</p>
      <input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
      <input id="pick" type="file" accept="image/*" multiple class="hidden">
      <div class="row">
        <button id="camBtn" type="button" class="primary grow">拍照</button>
        <button id="pickBtn" type="button" class="grow">從相簿選</button>
      </div>
      <div id="thumbs" class="thumbs"></div>
      <button id="sendBtn" type="button" class="good bigbtn" disabled>送出這張貨單</button>
    </div>

    <div class="plain">
      <div class="row"><h2 class="grow" style="margin:0">我的上傳</h2><button id="refresh" type="button">重新整理</button></div>
      <div id="mine" class="muted" style="margin-top:.5rem">讀取中…</div>
    </div>
    <p class="muted" style="text-align:center">v<span id="ver"></span></p>
  </div>
</section>

<script>window.PAGE_ROLE = 'store';</script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/common.js"></script>
<script>
'use strict';
var STATUS_TEXT = { uploaded: '已送出', queued: '排隊中', recognizing: '辨識中', review: '待核對', confirmed: '已入帳', failed: '辨識失敗', returned: '退回重拍' };
var staged = [];   // [{blob, url}]
var flushing = false;
var sending = false;     // 送出鈕處理中（防連點）
var batchCid = null;     // 同一批照片只產生一次 client_id；送出成功（已落 IndexedDB）才換新的

/* ---------- IndexedDB ---------- */
var dbp;
function db() {
  if (dbp) return dbp;
  dbp = new Promise(function (res, rej) {
    var r = indexedDB.open('mala_purchase', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('pending', { keyPath: 'client_id' }); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
  return dbp;
}
function tx(mode, fn) {
  return db().then(function (d) {
    return new Promise(function (res, rej) {
      var t = d.transaction('pending', mode), s = t.objectStore('pending'), out = fn(s);
      t.oncomplete = function () { res(out && out.result !== undefined ? out.result : undefined); };
      t.onerror = t.onabort = function () { rej(t.error); };
    });
  });
}
function dbPut(rec) { return tx('readwrite', function (s) { s.put(rec); }); }
function dbDel(id) { return tx('readwrite', function (s) { s.delete(id); }); }
function dbAll() { return tx('readonly', function (s) { return s.getAll(); }); }

/* ---------- 工具 ---------- */
function uuid4() {
  if (crypto.randomUUID) return crypto.randomUUID().toLowerCase();
  var b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  return h.replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/, '$1-$2-$3-$4-$5');
}
function showMsg(text, cls) { Common.showMsg('msg', text, cls); }

function resize(file) {   // 長邊 2400px、JPEG 0.85
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, m = Math.max(w, h), k = m > 2400 ? 2400 / m : 1;
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? res(b) : rej(new Error('縮圖失敗')); }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('這張照片讀不出來')); };
    img.src = url;
  });
}

/* ---------- 廠商 ---------- */
async function loadVendors() {
  var sel = $('vendorSel'), prev = sel.value, list = [];
  try { list = await API.call('/vendors'); } catch (e) { list = []; }
  sel.innerHTML = '<option value="">請選擇廠商</option>' +
    list.map(function (v) { return '<option value="' + esc(v.id) + '">' + esc(v.name) + '</option>'; }).join('') +
    '<option value="__other">（找不到，手動輸入）</option>';
  if (prev) sel.value = prev;
  if (!list.length) { sel.value = '__other'; }
  onVendor();
}
function onVendor() { $('vendorName').classList.toggle('hidden', $('vendorSel').value !== '__other'); checkSend(); }
$('vendorSel').onchange = onVendor;
$('vendorName').oninput = checkSend;
function vendorValue() {
  var v = $('vendorSel').value;
  if (v === '__other') { var n = $('vendorName').value.trim(); return n ? { vendor_name: n } : null; }
  return v ? { vendor_id: v } : null;
}

/* ---------- 拍照 ---------- */
$('camBtn').onclick = function () { $('cam').click(); };
$('pickBtn').onclick = function () { $('pick').click(); };
async function addFiles(files) {
  showMsg('');
  for (var i = 0; i < files.length; i++) {
    try { var b = await resize(files[i]); if (!batchCid) batchCid = uuid4(); staged.push({ blob: b, url: URL.createObjectURL(b) }); }
    catch (e) { showMsg(e.message, 'err'); }
  }
  renderThumbs();
}
$('cam').onchange = $('pick').onchange = function (e) { addFiles(e.target.files).then(function () { e.target.value = ''; }); };
function renderThumbs() {
  $('thumbs').innerHTML = staged.map(function (s, i) {
    return '<div class="thumb"><img src="' + s.url + '" alt="第' + (i + 1) + '張"><button data-i="' + i + '" aria-label="刪除">✕</button></div>';
  }).join('');
  Array.prototype.forEach.call($('thumbs').querySelectorAll('button'), function (b) {
    b.onclick = function () { var s = staged.splice(+b.dataset.i, 1)[0]; URL.revokeObjectURL(s.url); renderThumbs(); };
  });
  if (!staged.length && !sending) batchCid = null;
  checkSend();
}
function checkSend() { $('sendBtn').disabled = sending || !(staged.length && vendorValue()); }

$('sendBtn').onclick = async function () {
  if (sending) return;                       // 防連點：處理中一律忽略
  var v = vendorValue(); if (!v || !staged.length) return;
  sending = true; $('sendBtn').disabled = true;
  var batch = staged, cid = batchCid || (batchCid = uuid4());
  staged = [];                               // 先清畫面上的待送，再寫 IndexedDB
  try {
    var rec = { client_id: cid, vendor_id: v.vendor_id || null, vendor_name: v.vendor_name || null,
                photos: batch.map(function (s) { return s.blob; }), created: Date.now() };
    try { await dbPut(rec); }                // 先寫 IndexedDB 再送；同一批用同一個 client_id，重按也只會覆蓋同一筆
    catch (e) { staged = batch; showMsg('手機無法暫存照片，請確認不是無痕模式', 'err'); return; }
    batch.forEach(function (s) { URL.revokeObjectURL(s.url); }); batchCid = null; renderThumbs();
    showMsg('已存在手機，傳送中…', 'info');
    await updatePending(); await flush();
  } finally { sending = false; renderThumbs(); }
};

/* ---------- 補傳 ---------- */
async function sendOne(rec) {
  var fd = new FormData();
  fd.append('client_id', rec.client_id);
  if (rec.vendor_id) fd.append('vendor_id', rec.vendor_id);
  if (rec.vendor_name) fd.append('vendor_name', rec.vendor_name);
  rec.photos.forEach(function (b, i) { fd.append('photos[]', b, 'p' + (i + 1) + '.jpg'); });
  return API.call('/slips', { method: 'POST', body: fd, timeout: 120000 });
}
async function flush() {
  if (flushing || !API.session()) return;
  flushing = true;
  var sent = 0, failed = 0;
  try {
    var all = await dbAll();
    all.sort(function (a, b) { return a.created - b.created; });
    for (var i = 0; i < all.length; i++) {
      var r = all[i];
      if (r.fatal) continue;
      try { await sendOne(r); await dbDel(r.client_id); sent++; }
      catch (e) {
        if (e.code === 'CONFLICT') { await dbDel(r.client_id); sent++; continue; }   // 已收過，重送不變兩筆
        if (e.code === 'NETWORK' || e.status >= 500 || e.status === 401) { failed++; break; }
        r.fatal = e.message; await dbPut(r); failed++;   // 4xx：留著並顯示原因，不再自動重試
      }
    }
  } catch (e) { failed++; }
  flushing = false;
  await updatePending();
  if (sent) { showMsg('已送出 ' + sent + ' 張貨單', 'ok'); loadMine(); }
  else if (failed) showMsg('目前送不出去，已先存在手機，連上網路會自動補傳', 'err');
}
async function updatePending() {
  var all = []; try { all = await dbAll(); } catch (e) {}
  var bar = $('pendingBar');
  bar.classList.toggle('hidden', !all.length);
  var fatal = all.filter(function (r) { return r.fatal; });
  $('pendingText').textContent = all.length + ' 張待送' + (fatal.length ? '（' + fatal.length + ' 張被伺服器拒絕：' + fatal[0].fatal + '）' : '');
}
$('retryNow').onclick = async function () {
  var all = await dbAll();
  for (var i = 0; i < all.length; i++) { delete all[i].fatal; await dbPut(all[i]); }
  flush();
};
window.addEventListener('online', function () { flush(); });
setInterval(function () { flush(); }, 30000);

/* ---------- 我的上傳 ---------- */
async function loadMine() {
  var box = $('mine');
  try {
    var list = await API.call('/slips?mine=1');
    if (!list.length) { box.textContent = '最近 30 天還沒有上傳'; return; }
    box.innerHTML = list.map(function (s) {
      var ret = s.status === 'returned';
      return '<div class="slip' + (ret ? ' ret' : '') + '"><div class="row"><span class="t grow">' + esc(s.vendor_name || '（未指定廠商）') +
        '</span><span class="badge b-' + esc(s.status) + '">' + esc(STATUS_TEXT[s.status] || s.status) + '</span></div>' +
        '<div class="muted">' + esc(s.id) + '　' + esc(twTime(s.uploaded_at)) + '</div>' +
        (ret ? '<div style="color:var(--red-t);font-weight:600">請重新拍照上傳這張貨單' + (s.return_reason ? '：' + esc(s.return_reason) : '') + '</div>' : '') + '</div>';
    }).join('');
  } catch (e) { box.textContent = '讀不到上傳紀錄：' + e.message; }
}
$('refresh').onclick = loadMine;

Common.gate({
  title: '貨單上傳', roles: ['store'], roleError: '請用門市代號登入', upper: true,
  loginHint: '請用門市代號登入（例如 X01）', accLabel: '門市代號',
  who: function (s) { return s.name || s.store_id || ''; },
  previewBrand: function (v) { var c = (v || '').charAt(0).toUpperCase(); return THEMES[c] && c !== '_' ? c : null; },
  onReady: function () { $('ver').textContent = CFG.VERSION; loadVendors(); loadMine(); updatePending(); flush(); }
});
</script>
</body>
</html>
