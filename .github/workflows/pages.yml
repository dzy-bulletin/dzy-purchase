# 只把 web/（排除開發用 dev/）發佈到 GitHub Pages：https://dzy-bulletin.github.io/dzy-purchase/
name: pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 準備網站（排除 dev/）
        run: |
          mkdir -p _site
          rsync -a --exclude dev/ --exclude '_tmp*' web/ _site/
          test -f _site/upload.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
